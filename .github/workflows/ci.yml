name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint & Hexagonal DAG check
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build packages and apps
        run: pnpm build

      - name: Verify zero @stellar/stellar-xdr-json in PWA assets
        run: |
          if grep -rq "stellar-xdr-json" apps/pwa/dist/assets/; then
            echo "ERROR: @stellar/stellar-xdr-json leaked into apps/pwa/dist/assets"
            exit 1
          fi

      - name: Rust Soroban contract formatting, clippy, and unit tests
        run: |
          cargo fmt --manifest-path contracts/claim-escrow/Cargo.toml --check
          cargo clippy --manifest-path contracts/claim-escrow/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path contracts/claim-escrow/Cargo.toml

      - name: Zero-hardcoding & secret scan
        run: pnpm secret-scan

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
