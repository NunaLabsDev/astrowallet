RELAY_MAX_FEE_STROOPS = "2000000"
RELAY_DAILY_BUDGET_STROOPS = "500000000"
TELEGRAM_API_ORIGIN = "https://api.telegram.org"
TG_BOT_USERNAME = "AstroWalletAppBot"
TG_MINI_APP_SHORT_NAME = "wallet"

